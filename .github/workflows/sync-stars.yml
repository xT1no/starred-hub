name: Sync starred repos

# 每天北京时间 08:00 跑一次。
# GitHub Actions 的 cron 用的是 UTC，所以这里写 0 0 * * *（= UTC 00:00 = UTC+8 08:00）。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/sync-stars.yml"

# 同一时间只允许一个同步任务，避免两次运行互相覆盖
concurrency:
  group: sync-stars
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 STARS_TOKEN 是否已配置
        env:
          GH_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::仓库还没有配置 STARS_TOKEN。请到 Settings → Secrets and variables → Actions 新建一个名为 STARS_TOKEN 的 secret（值是一个只勾 read:user 的 token），然后点 Re-run。"
            exit 1
          fi

      - name: 同步星标并重新生成文档
        env:
          GH_TOKEN: ${{ secrets.STARS_TOKEN }}
          NEW_DAYS: "14"
        run: python scripts/sync.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git add -A
          git commit -m "chore: 同步星标仓库 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
