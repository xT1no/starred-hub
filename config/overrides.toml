# ============================================================================
# 手动分类覆盖
# ============================================================================
# 自动分类永远不可能 100% 准。遇到归错类的仓库，写在这里，
# 之后每次同步都会优先采用你写的分类，不会被自动规则覆盖。
#
# 写法：
#   [repos."所有者/仓库名"]      ← 必须是 full_name，大小写不敏感
#   platform = ["Windows"]        ← 写了就整体替换自动识别出的平台
#   function = ["系统工具"]       ← 写了就整体替换自动识别出的功能
#   note     = "自己加一句话备注"  ← 可选，会显示在简介前面
#
# 分类名可以写中文名，也可以写 slug（见 rules.toml 的 name / slug 字段）。
# 只写 platform 不写 function 的话，功能维度继续用自动识别结果。
#
# 例：
# [repos."microsoft/PowerToys"]
# platform = ["Windows"]
# function = ["系统工具"]
# note = "Windows 必备增强工具集"
# ============================================================================
