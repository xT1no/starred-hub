# ============================================================================
# 手动分类覆盖
# ============================================================================
# 自动分类永远不可能 100% 准（尤其是没有描述、纯中文名、或一个仓库身兼数职的）。
# 下面这些是逐个看过之后钉死的分类，每次同步都优先采用，不会被自动规则覆盖。
#
# 写法：
#   [repos."所有者/仓库名"]      ← full_name，大小写不敏感
#   platform = ["Windows"]        ← 写了就整体替换自动识别的平台
#   function = ["系统增强 / 优化"]  ← 写了就整体替换自动识别的功能
#   note     = "自己的一句话备注"   ← 可选，显示在简介前面
#
# 分类名可以写中文名，也可以写 slug（见 rules.toml 的 name / slug 字段）。
# ============================================================================


