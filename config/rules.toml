# ============================================================================
# 分类规则
# ============================================================================
# 匹配对象：仓库名 / 仓库名分词 / topics / 描述（中英文都匹配）
# 文件里越靠前的规则优先级越高 —— 命中多条时，靠前的那个决定「主分类」
# 改动保存后，下一次定时任务（或手动 Run workflow）自动生效
#
# 只想给某一个仓库钉死分类？别改这里，去 config/overrides.toml
# ============================================================================


# ---------------------------------------------------------------------------
# 平台维度：这个仓库装在哪儿 / 跑在哪儿
# 路由器固件这类特征词最先判，避免被 windows / linux 抢走
# ---------------------------------------------------------------------------

[[platform]]
name = "路由器 / 固件"
slug = "router"
emoji = "🛰️"
patterns = [
  "openwrt", "immortalwrt", "lede", "asuswrt", "merlin", "padavan",
  "firmware", "ipk", "luci", "软路由", "路由器", "固件", "刷机",
  "梅林", "旁路由",
]

[[platform]]
name = "服务端 / 云端"
slug = "server"
emoji = "☁️"
patterns = [
  "cloudflare", "cloudflare-workers", "cloudflare-pages", "workers", "worker",
  "serverless", "vps", "serv00", "panel", "面板", "反代", "订阅转换", "后端",
]

[[platform]]
name = "Windows"
slug = "windows"
emoji = "🪟"
