# ============================================================================
# 分类规则
# ============================================================================
# 匹配对象：仓库名 / 仓库名分词 / topics / 描述
# 文件里越靠前的规则优先级越高 —— 命中多条时，靠前的那个决定「主分类」
# 改动保存后，下一次定时任务（或手动 Run workflow）自动生效
#
# 只想给某一个仓库钉死分类？别改这里，去 config/overrides.toml
# ============================================================================


# ---------------------------------------------------------------------------
# 平台维度：这个仓库装在哪儿 / 跑在哪儿
# ---------------------------------------------------------------------------

[[platform]]
name = "Windows"
slug = "windows"
emoji = "🪟"
patterns = [
  "windows", "win32", "win64", "win10", "win11", "wpf", "uwp", "winui", "winui3",
  "powershell", "winget", "directx", "msi", "portable-app", "windows-app",
  "windows-tool", "registry-editor", "windows-forms",
]

[[platform]]
name = "macOS"
slug = "macos"
emoji = "🍎"
patterns = [
  "macos", "mac-os", "macosx", "osx", "os-x", "cocoa", "appkit", "dmg",
  "homebrew", "apple-silicon", "macbook", "mac-app", "macos-app", "launchd",
]

[[platform]]
